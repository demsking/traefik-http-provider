##
## https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "traefik-http-provider"
version = "3.0.0-beta2"
description = "Traefik HTTP Provider is a REST service that allows external services to register and expose their Traefik HTTP provider JSON content."
keywords = ["traefik", "http", "provider"]
authors = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
maintainers = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.12"
include = ["traefik-http-provider"]

dependencies = [
  "fastapi[standard]>=0.118.0",
  "oremi-core>=2.5.3",
  "redis>=6.4.0",
]

[project.scripts]
traefik-http-provider = "traefik_http_provider:main"

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Documentation" = "https://demsking.gitlab.io/traefik-http-provider/-/blob/main/README.md"
"Source" = "https://gitlab.com/demsking/traefik-http-provider"
"Issues" = "https://gitlab.com/demsking/traefik-http-provider/-/issues"

[dependency-groups]
dev = [
  "autopep8>=2.3.2",
  "bandit>=1.8.3",
  "pylint>=3.3.7",
  "pyroma>=4.2",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "python-dotenv>=1.1.0",
  "python-slugify>=8.0.4",
  "reorder-python-imports>=3.14.0",
  "trio>=0.30.0",
]

[tool.skjold]
sources = ["pyup", "gemnasium", "osv", "pypa"]
report_only = false

[tool.pytest.ini_options]
python_functions = "test_"
