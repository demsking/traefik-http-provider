---
services:
  server:
    build:
      context: .
    user: root
    environment:
      EXPIRATION_MINUTES: 5
      PROVIDERS_DATABASE: '/data/providers.db'
      LOG_LEVEL: 'debug'
    volumes:
      - ./data:/data
    ports:
      - 56116:6116
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: poetry.lock
        - action: sync+restart
          path: pyproject.toml
          target: /opt/traefik-http-provider/pyproject.toml
        - action: sync+restart
          path: DOCUMENTATION.md
          target: /opt/traefik-http-provider/DOCUMENTATION.md
        - action: sync+restart
          path: server
          target: /opt/traefik-http-provider/server
        - action: rebuild
          path: bin/
          target: /opt/traefik-http-provider/bin
    # command: --reload --reload-dir /opt/traefik-http-provider/server --workers 1
    entrypoint: python /opt/traefik-http-provider/server
...
