---
services:
  server:
    build:
      context: .
    user: root
    environment:
      EXPIRATION_MINUTES: 5
      DATA_PATH: '/data'
      LOG_LEVEL: 'DEBUG'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./data:/data
    ports:
      - 56116:6116
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: uv.lock
        - action: sync+restart
          path: pyproject.toml
          target: /opt/demsking/pyproject.toml
        - action: sync+restart
          path: DOCUMENTATION.md
          target: /opt/demsking/DOCUMENTATION.md
        - action: sync+restart
          path: src/
          target: /opt/demsking/src

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - "60 1"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--bind"
      - "0.0.0.0"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
...
